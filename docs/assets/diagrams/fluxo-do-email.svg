<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
<title id="t">Do report ao e-mail executivo</title>
<desc id="d">Geração do e-mail-resumo e do arquivo .eml a partir do report.</desc>
<defs><marker id="ponta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5D6270"/></marker></defs>
<rect width="1200" height="420" rx="18" fill="#F7F5F0"/>
<text x="32" y="44" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#14161B">Do report ao e-mail executivo</text>
<rect x="32" y="80" width="220" height="140" rx="14" fill="#14161B" stroke="#14161B" stroke-width="1.5"/>
<text x="48" y="106" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#9AA3B2">ORIGEM</text>
<text x="48" y="128" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">Report do mês</text>
<text x="48" y="150" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" fill="#D5D9E0">a página aberta</text>
<text x="48" y="170" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" fill="#D5D9E0">no emulador</text>
<path d="M252,150 L292,150" fill="none" stroke="#5D6270" stroke-width="1.8" marker-end="url(#ponta)"/>
<rect x="292" y="80" width="270" height="140" rx="14" fill="#FFFFFF" stroke="#DCD7CD" stroke-width="1.5"/>
<text x="308" y="106" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#5D6270">SUGESTÃO</text>
<text x="308" y="128" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#14161B">Leitura do report</text>
<text x="308" y="150" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5D6270">Frase do mês e período</text>
<text x="308" y="170" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5D6270">Destaques sugeridos: os</text>
<text x="308" y="190" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5D6270">principais resultados</text>
<path d="M562,150 L602,150" fill="none" stroke="#5D6270" stroke-width="1.8" marker-end="url(#ponta)"/>
<rect x="602" y="80" width="270" height="140" rx="14" fill="#E8EEFF" stroke="#C9D6FF" stroke-width="1.5"/>
<text x="618" y="106" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#2D5BFF">ESCOLHA</text>
<text x="618" y="128" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#14161B">Até 4 destaques</text>
<text x="618" y="150" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5D6270">Tirar, incluir, ordenar, editar</text>
<text x="618" y="170" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5D6270">Link do report completo</text>
<text x="618" y="190" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5D6270">Imagem ou capa de vídeo</text>
<path d="M872,150 L912,150" fill="none" stroke="#5D6270" stroke-width="1.8" marker-end="url(#ponta)"/>
<rect x="912" y="80" width="256" height="140" rx="14" fill="#E3F2EF" stroke="#9FD5CC" stroke-width="1.5"/>
<text x="928" y="106" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#0F8A7E">SAÍDA</text>
<text x="928" y="128" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#14161B">Arquivos</text>
<text x="928" y="150" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5D6270">E-mail-resumo (.eml)</text>
<text x="928" y="170" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5D6270">E-mail completo (.eml, opcional)</text>
<text x="928" y="190" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5D6270">Imagem do resumo (.png)</text>
<rect x="292" y="252" width="876" height="108" rx="14" fill="#FFFFFF" stroke="#DCD7CD" stroke-width="1.5"/>
<text x="308" y="278" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#5D6270">ENQUANTO EDITA</text>
<text x="308" y="300" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#14161B">Prévia e status em tempo real</text>
<text x="308" y="322" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5D6270">Prévia no computador e no celular · HTML compatível com o Outlook (tabelas, estilos em linha, modo escuro)</text>
<text x="308" y="342" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5D6270">Status de cada etapa: o download só libera quando o link e os campos obrigatórios estão certos</text>
<path d="M737,220 L737,252" fill="none" stroke="#5D6270" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#ponta)"/>
<text x="32" y="400" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12" fill="#5D6270">Nenhum serviço de envio: o .eml abre no Outlook de quem envia, e o envio é feito pela própria pessoa.</text>
</svg>
